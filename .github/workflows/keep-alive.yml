name: Keep Render Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Frontend
        run: curl -sSf https://mairafx.onrender.com > /dev/null
      - name: Ping Backend API
        run: curl -sSf https://mairafx.onrender.com/api/cot/EUR_USD > /dev/null
