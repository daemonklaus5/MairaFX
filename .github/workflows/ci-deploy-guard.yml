name: CI Deploy Guardrail

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify Frontend Build (Dry-Run)
        working-directory: ./frontend
        run: npm run build

      # If the build above fails, the workflow stops here and GitHub marks the commit as 'failed'.
      # Render's "After CI Checks Pass" setting will see this failure and block the deployment.
