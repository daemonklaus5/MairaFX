name: Nightly Pipeline Verification

on:
  schedule:
    - cron: '0 2 * * *' # 2am UTC daily
  workflow_dispatch: # Allows manual trigger

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci || npm install

    - name: Start Express Server & Wait
      working-directory: ./backend
      env:
        OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
        OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        npm start &
        # Wait for the server to spin up and apply migrations
        npx wait-on http-get://127.0.0.1:3000/api/data-pipeline/status -t 30000

    - name: Run CI Backtest Runner
      working-directory: ./backend
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: node scripts/ci_backtest_runner.js

    - name: Upload Backtest JSON Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backtest-results
        path: backend/backtest_results.json
        retention-days: 7
